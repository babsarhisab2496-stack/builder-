name: Build Android
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: unzip -q "$(ls *.zip | head -n1)" -d proj
      - name: Fix kotlin
        run: |
          sed -i "s|^dependencies{|dependencies{\nimplementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')|" proj/app/build.gradle
      - working-directory: proj
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: proj/app/build/outputs/apk/release/*.apk
